name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Manifests, MCP configs and skills agree
        run: node scripts/validate.mjs
      - name: Claude Code plugin validator
        run: npx -y @anthropic-ai/claude-code plugin validate .
